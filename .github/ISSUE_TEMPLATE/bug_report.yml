name: Bug report
description: 报告可复现的 GreenNote Travel 问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴 API key、CloudBase credential、Cookie、私人旅行订单或个人信息。
  - type: input
    id: version
    attributes:
      label: GreenNote Travel 版本
      placeholder: 例如 V1.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - Local Demo
        - CloudBase
        - 其他自托管环境
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 使用虚构或脱敏数据描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器与操作系统
      placeholder: 例如 Chrome / Windows 11
